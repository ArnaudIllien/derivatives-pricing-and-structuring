# Runs the three offline test suites on every push and pull request.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pricing library
        run: python -m unittest discover -s pricer/test -t .
      - name: Market dashboard
        run: python -m unittest discover -s market_watch/test -t .
      - name: Structuring platform
        run: python -m unittest discover -s structuring/test -t .
